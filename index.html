<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Austin Joshua — Portfolio</title>
    <meta
      name="description"
      content="Engineering portfolio of Austin Joshua presenting software engineering work, AI systems, technical skills, and interactive 3D craft."
    />
    <link
      rel="preload"
      href="/fonts/syne-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Pre-paint theme initialization (FR-033, FR-035); deterministic for T9.3 CSP SHA-256 hashing -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('aj-portfolio-theme');
          if (stored === 'dark' || stored === 'light') {
            theme = stored;
          }
        } catch {
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
