<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020307" />
    <title>Austin Joshua — AJ Cosmic Universe</title>
    <meta
      name="description"
      content="AJ Cosmic Universe: Interactive 3D solar-system engineering portfolio of Austin Joshua featuring software engineering, AI systems, and orbital exploration."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/syne-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- First-visit pre-paint intro curtain gate; SHA-256 hash enforced in vercel.json CSP -->
    <script>
      (function () {
        try {
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var seen = window.localStorage.getItem('aj-cosmic-intro-seen') === '1';
          if (!reduced && !seen) {
            document.documentElement.classList.add('aj-intro-pending');
          } else {
            document.documentElement.classList.add('aj-intro-seen');
          }
        } catch {
          document.documentElement.classList.add('aj-intro-seen');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
